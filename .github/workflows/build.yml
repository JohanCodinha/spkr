name: Build

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'build.js'
      - 'package.json'
      - 'playwright.config.js'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'build.js'
      - 'package.json'
      - 'playwright.config.js'
  workflow_dispatch:

# Prevent duplicate runs, cancel in-progress runs on new push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-jammy
    steps:
      - uses: actions/checkout@v4

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-

      - run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate --production || true

      - name: Install ffmpeg (for screenshots)
        run: apt-get update && apt-get install -y ffmpeg

      - name: Run unit tests
        run: npm run test:unit

      - name: Build debug (includes test hooks)
        run: npm run build:debug

      - name: Run E2E tests (update snapshots on main)
        run: npx playwright test --update-snapshots

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7

      - name: Generate screenshots
        run: npm run screenshots

      - name: Build production (strips debug code)
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            public/
            screenshots/
          retention-days: 1

      - name: Upload test snapshots
        uses: actions/upload-artifact@v4
        with:
          name: test-snapshots
          path: tests/**/*-snapshots/
          retention-days: 1

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history to check if release branch exists

      - uses: actions/download-artifact@v4
        with:
          name: build-output

      - uses: actions/download-artifact@v4
        with:
          name: test-snapshots
          path: tests/

      - name: Commit updated snapshots to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/
          if ! git diff --staged --quiet; then
            git commit -m "Update test snapshots [skip ci]"
            git push origin main
          fi

      - name: Deploy to release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Save artifacts outside git tree
          rm -f screenshots/*.webm
          cp -r public /tmp/public
          cp -r screenshots /tmp/screenshots

          # Switch to release branch (orphan if doesn't exist)
          if git show-ref --verify --quiet refs/remotes/origin/release; then
            git checkout release
          else
            git checkout --orphan release
            git rm -rf .
          fi

          # Copy artifacts and commit
          rm -rf public screenshots
          cp -r /tmp/public public
          cp -r /tmp/screenshots screenshots
          git add public/ screenshots/

          if ! git diff --staged --quiet; then
            git commit -m "Build from main@${GITHUB_SHA::7}"
            git push origin release
          else
            echo "No changes to deploy"
          fi

      - name: Trigger parent deploy
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: gh workflow run deploy.yml --repo JohanCodinha/tools-gateway
