name: Build

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'build.js'
      - 'package.json'
      - 'playwright.config.js'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'build.js'
      - 'package.json'
      - 'playwright.config.js'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # JOB 1: Setup - shared prep work, cached
  # ------------------------------------------------------------------
  setup:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-jammy
    steps:
      - uses: actions/checkout@v4

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-

      - run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate --production || true

      - name: Run unit tests
        run: npm run test:unit

      - name: Build debug (includes test hooks)
        run: npm run build:debug

      # Upload workspace for parallel jobs
      - name: Upload workspace
        uses: actions/upload-artifact@v4
        with:
          name: workspace
          path: |
            .
            !node_modules
          retention-days: 1

      - name: Upload node_modules
        uses: actions/upload-artifact@v4
        with:
          name: node_modules
          path: node_modules
          retention-days: 1

  # ------------------------------------------------------------------
  # JOB 2: E2E Tests (parallel with screenshots)
  # ------------------------------------------------------------------
  e2e-tests:
    needs: setup
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-jammy
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: workspace

      - uses: actions/download-artifact@v4
        with:
          name: node_modules
          path: node_modules

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7

      - name: Build production
        run: npm run build

      - name: Upload public
        uses: actions/upload-artifact@v4
        with:
          name: public
          path: public/
          retention-days: 1

  # ------------------------------------------------------------------
  # JOB 3: Screenshots (parallel with E2E)
  # ------------------------------------------------------------------
  screenshots:
    needs: setup
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-jammy
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: workspace

      - uses: actions/download-artifact@v4
        with:
          name: node_modules
          path: node_modules

      - name: Install ffmpeg
        run: apt-get update && apt-get install -y ffmpeg

      - name: Generate screenshots
        run: npm run screenshots

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          retention-days: 1

  # ------------------------------------------------------------------
  # JOB 4: Deploy (waits for both parallel jobs)
  # ------------------------------------------------------------------
  deploy:
    needs: [e2e-tests, screenshots]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: public
          path: public/

      - uses: actions/download-artifact@v4
        with:
          name: screenshots
          path: screenshots/

      - name: Deploy to release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          rm -f screenshots/*.webm
          cp -r public /tmp/public
          cp -r screenshots /tmp/screenshots

          if git show-ref --verify --quiet refs/remotes/origin/release; then
            git checkout release
          else
            git checkout --orphan release
            git rm -rf .
          fi

          rm -rf public screenshots
          cp -r /tmp/public public
          cp -r /tmp/screenshots screenshots
          git add public/ screenshots/

          if ! git diff --staged --quiet; then
            git commit -m "Build from main@${GITHUB_SHA::7}"
            git push origin release
          else
            echo "No changes to deploy"
          fi

      - name: Trigger parent deploy
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: gh workflow run deploy.yml --repo JohanCodinha/tools-gateway
