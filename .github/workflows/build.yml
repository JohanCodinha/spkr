name: Build

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'build.js'
      - 'package.json'
      - 'playwright.config.js'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'scripts/**'
      - 'build.js'
      - 'package.json'
      - 'playwright.config.js'
  workflow_dispatch:

# Prevent duplicate runs, cancel in-progress runs on new push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-

      - run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=moderate --production || true

      - name: Install ffmpeg (for screenshots)
        run: apt-get update && apt-get install -y ffmpeg

      - name: Run unit tests
        run: npm run test:unit

      - name: Build debug (includes test hooks)
        run: npm run build:debug

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          retention-days: 7

      - name: Generate screenshots
        run: npm run screenshots

      - name: Build production (strips debug code)
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            public/
            screenshots/
          retention-days: 1

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: Commit build output and screenshots if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -f screenshots/*.webm
          git add public/ screenshots/
          if ! git diff --staged --quiet; then
            git commit -m "Build: update public/index.html and screenshots"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Trigger parent deploy
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: gh workflow run deploy.yml --repo JohanCodinha/tools-gateway
