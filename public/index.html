            <h1 class="lobby-title">Scrum Poker</h1>
            <p class="lobby-subtitle">Plan together, anywhere</p>

            <!-- Player Setup -->
            <div class="lobby-section">
                <div class="lobby-identity">
                    <div class="color-picker-wrapper lobby-color">
                        <input type="color" id="lobby-color-input" class="color-input" value="#3b82f6">
                        <div id="lobby-color-preview" class="color-preview"></div>
                    </div>
                    <input type="text" id="lobby-name-input" class="lobby-name-input" placeholder="Your name" maxlength="20">
                </div>
            </div>

            <!-- Room Actions -->
            <div class="lobby-section">
                <button id="create-room-btn" class="lobby-btn lobby-btn-primary">
                    Create Room
                </button>

                <div class="lobby-divider">
                    <span>or join existing</span>
                </div>

                <div class="lobby-join">
                    <input type="text" id="room-code-input" class="lobby-code-input" placeholder="Enter room code" maxlength="6">
                    <button id="join-room-btn" class="lobby-btn lobby-btn-secondary">
                        Join
                    </button>
                </div>
            </div>

            <!-- Connection Status -->
            <div id="lobby-status" class="lobby-status hidden">
                <div class="lobby-spinner"></div>
                <span id="lobby-status-text">Connecting...</span>
            </div>

            <!-- Error Message -->
            <div id="lobby-error" class="lobby-error hidden"></div>
        </div>
    </div>

    <!-- Game Canvas -->
    <canvas id="game-canvas" class="game-canvas hidden" aria-label="Scrum poker game board"></canvas>

    <!-- UI Overlay -->
    <div id="ui-layer" class="ui-layer hidden">

        <!-- Header -->
        <div class="header">
            <!-- Room Info - Top Left -->
            <div class="glass-panel room-info">
                <div id="connection-beacon" class="connection-beacon" aria-label="Connection status">
                    <span class="beacon-dot"></span>
                </div>
                <span class="room-label">Room:</span>
                <span id="room-code-display" class="room-code">----</span>
                <button id="copy-room-btn" class="copy-btn" aria-label="Copy room code">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                </button>
                <button id="leave-room-btn" class="leave-btn" aria-label="Leave room">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
                </button>
            </div>

            <!-- Avatar UI - Top Center -->
            <div class="glass-panel avatar-wrapper">
                <div id="avatar-container" class="avatar-container" role="status" aria-live="polite" aria-label="Player voting status">
                    <!-- Avatars injected via JS -->
                </div>
            </div>

            <!-- Identity Controls - Top Right -->
            <div class="glass-panel identity-controls">
                <div class="color-picker-wrapper">
                    <label for="user-color-input-inline" class="sr-only">Choose your color</label>
                    <input type="color" id="user-color-input-inline" class="color-input" value="#3b82f6">
                    <div id="color-preview-inline" class="color-preview" aria-hidden="true"></div>
                </div>
                <label for="user-name-input-inline" class="sr-only">Enter your name</label>
                <input type="text" id="user-name-input-inline" class="name-input" value="You" placeholder="Your name">
            </div>
        </div>

        <!-- Settings Button - Bottom Right -->
        <button id="settings-btn" class="glass-panel settings-btn" aria-label="Open settings" aria-expanded="false" aria-controls="settings-panel">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>

        <!-- Settings Panel (Initially Hidden) -->
        <div id="settings-panel" class="hidden glass-panel settings-panel" role="dialog" aria-label="Physics configuration">

            <h3 class="settings-title">Physics Config</h3>

            <div class="settings-content">
                <div class="slider-group">
                    <div class="slider-header">
                        <label for="slider-restitution">Restitution (Bounce)</label>
                        <span id="val-restitution">0.6</span>
                    </div>
                    <input type="range" id="slider-restitution" min="0" max="1.2" step="0.1" value="0.6" data-config="restitution">
                </div>

                <div class="slider-group">
                    <div class="slider-header">
                        <label for="slider-frictionAir">Friction (Drag)</label>
                        <span id="val-frictionAir">0.035</span>
                    </div>
                    <input type="range" id="slider-frictionAir" min="0" max="0.07" step="0.001" value="0.035" data-config="frictionAir">
                </div>

                <div class="slider-group">
                    <div class="slider-header">
                        <label for="slider-throwForce">Throw Force</label>
                        <span id="val-throwForce">0.09</span>
                    </div>
                    <input type="range" id="slider-throwForce" min="0.01" max="0.17" step="0.005" value="0.09" data-config="throwForce">
                </div>

                <div class="slider-group">
                    <div class="slider-header">
                        <label for="slider-spin">Spin Force</label>

    nameContainer.appendChild(nameText);
    pill.appendChild(initials);
    pill.appendChild(nameContainer);
    wrapper.appendChild(pill);
    elements.avatarContainer.appendChild(wrapper);
  });
}

// src/connection-status.js
var beaconEl = null;
function initConnectionStatus() {
  beaconEl = document.getElementById("connection-beacon");
}
function setAdvertising() {
  if (!beaconEl) return;
  beaconEl.classList.remove("connected");
  beaconEl.classList.add("advertising");
}
function setConnected() {
  if (!beaconEl) return;
  beaconEl.classList.remove("advertising");
  beaconEl.classList.add("connected");
}
function updatePeerCount(count) {
  if (count > 0) {
    setConnected();
  } else {
    setAdvertising();
  }
}

// src/game.js
function getPlayerPositions(count) {
  const positions = [];
  for (let i = 0; i < count; i++) {
    const angle = i / count * Math.PI * 2 - Math.PI / 2;
    const x = 0.5 + Math.cos(angle) * 0.6;
    const y = 0.5 + Math.sin(angle) * 0.6;
    positions.push({ x, y });
  }
  return positions;
}
function generateRandomName() {
  const adj = NAME_ADJECTIVES[Math.floor(Math.random() * NAME_ADJECTIVES.length)];
  const animal = NAME_ANIMALS[Math.floor(Math.random() * NAME_ANIMALS.length)];
  return `${adj} ${animal}`;
}
function generateRandomColor() {
  return RANDOM_COLORS[Math.floor(Math.random() * RANDOM_COLORS.length)];
}
function loadIdentityFromStorage() {
  const savedName = localStorage.getItem(STORAGE_KEY_NAME);
  const savedColor = localStorage.getItem(STORAGE_KEY_COLOR);
  return { name: savedName, color: savedColor };
}
function init() {
  cacheElements();
  setupEventListeners();
  setCtx(elements.canvas.getContext("2d"));
  initEngine();
  initConnectionStatus();
  const saved = loadIdentityFromStorage();
  const randomName = generateRandomName();
  elements.lobbyNameInput.placeholder = randomName;
  if (saved.name) {
    elements.lobbyNameInput.value = saved.name;
    localPlayer.name = saved.name;
  } else {
    localPlayer.name = randomName;
  }
  const color = generateRandomColor();
  localPlayer.color = color;
  elements.lobbyColorInput.value = color;
  elements.lobbyColorPreview.style.backgroundColor = color;
  setupMultiplayerHandlers();
  setStartGameCallback(startGame);
  resize();
  window.addEventListener("resize", resize);
  requestAnimationFrame(loop);
  checkUrlForRoom();
}
function setupEventListeners() {
  elements.createRoomBtn.addEventListener("click", createRoom);
  elements.joinRoomBtn.addEventListener("click", joinRoom);
  elements.roomCodeInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") joinRoom();
  });
  elements.lobbyColorInput.addEventListener("input", (e) => {
    elements.lobbyColorPreview.style.backgroundColor = e.target.value;
    localPlayer.color = e.target.value;
  });
  elements.copyRoomBtn.addEventListener("click", copyRoomCode);
  elements.leaveRoomBtn.addEventListener("click", handleLeaveRoom);
  elements.settingsBtn.addEventListener("click", toggleSettings);
  elements.colorInput.addEventListener("input", (e) => {
    updateIdentity("color", e.target.value);
  });
  elements.nameInput.addEventListener("input", (e) => {
    updateIdentity("name", e.target.value);
  });
  elements.revealBtn.addEventListener("click", revealCards);
  document.querySelectorAll("[data-config]").forEach((slider) => {
    slider.addEventListener("input", (e) => {
      updateConfig(e.target.dataset.config, e.target.value);
    });
  });
}
function handleLeaveRoom() {
  leaveRoom();
  resetGameState();
}
function startGame() {
  hideLobby();
  hideLobbyStatus();
  elements.canvas.addEventListener("click", handleCanvasClick);
  elements.canvas.addEventListener("mousemove", handleCanvasMove, { passive: true });
  setAdvertising();
  updatePeerCount(players.size);
  buildDeck();
  renderHeader();
}
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const w = window.innerWidth;
  const h = window.innerHeight;
  setDimensions(w, h);
  elements.canvas.width = w * dpr;
  elements.canvas.height = h * dpr;
  elements.canvas.style.width = w + "px";
  elements.canvas.style.height = h + "px";
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
function buildDeck() {
  elements.deck.innerHTML = "";
  FIBONACCI.forEach((val) => {
    const btn = document.createElement("button");
    btn.className = "deck-card";
    btn.innerText = val;
    btn.setAttribute("role", "button");
    btn.setAttribute("aria-label", `Vote ${val}`);
    btn.onclick = () => userVote(val);
    btn.onkeydown = (e) => {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        userVote(val);
      }
    };
    elements.deck.appendChild(btn);
  });
}
function handleCanvasClick(e) {
  if (!isRevealed) return;
  const rect = elements.canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const cx = width / 2;
  const cy = height / 2;
  const dist = Math.sqrt((x - cx) ** 2 + (y - cy) ** 2);
  if (dist <= RESET_BUTTON_RADIUS) {
    resetGame();
  }
}
function handleCanvasMove(e) {
  if (!isRevealed) {
    elements.canvas.style.cursor = "default";
    return;
  }
  const rect = elements.canvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  const cx = width / 2;
  const cy = height / 2;
  const dist = Math.sqrt((x - cx) ** 2 + (y - cy) ** 2);
  elements.canvas.style.cursor = dist <= RESET_BUTTON_RADIUS ? "pointer" : "default";
}
function setupMultiplayerHandlers() {
  onPeerJoin((peerId) => {
    console.log("Peer joined:", peerId);
    broadcastPlayerInfo({
      name: localPlayer.name,
      color: localPlayer.color,
      voted: localPlayer.voted
    });
    if (localPlayer.voted && localPlayer.vote !== null) {
      broadcastVote(localPlayer.vote, {
        id: localPlayer.id,
        name: localPlayer.name,
        color: localPlayer.color
      });
    }
    if (isRevealed) {
      broadcastReveal();
    }
  });
  onPeerLeave((peerId) => {
    console.log("Peer left:", peerId);
    players.delete(peerId);
    setCards(cards.filter((c) => c.player.id !== peerId));
    updatePeerCount(players.size);
    renderHeader();
    checkState();
  });
  onPlayerInfoReceived((data, peerId) => {
    console.log("Player info received:", peerId, data);
    const existingPlayer = players.get(peerId);
    const isNewPlayer = !existingPlayer;
    players.set(peerId, {
      id: peerId,
      name: data.name,
      color: data.color,
      voted: data.voted || (existingPlayer?.voted ?? false),
      pos: existingPlayer?.pos || { x: 0.5, y: 0.5 }
    });
    if (isNewPlayer) {
      updatePeerCount(players.size);
      emit("peerJoined", { peerId, count: players.size + 1 });
    }
    updatePlayerPositions();
    renderHeader();
  });
  onVoteReceived((data, peerId) => {
    console.log("Vote received:", peerId, data);
    let player = players.get(peerId);
    if (!player && data.player) {
      player = {
        id: peerId,
        name: data.player.name,
        color: data.player.color,
        voted: false,
        pos: { x: 0.5, y: 0.5 }
      };
      players.set(peerId, player);
      updatePlayerPositions();
      updatePeerCount(players.size);
    }
    const cardExists = cards.some((c) => c.player.id === peerId);
    if (player && !cardExists) {
      player.voted = true;
      player.vote = data.value;
      const card = spawnCard(player, data.value);
      if (isRevealed && card) {
        positionCardsForReveal();
      }
      renderHeader();
      checkState();
    }
  });
  onRevealReceived((data, peerId) => {
    console.log("Reveal received from:", peerId);
    if (!isRevealed) {
      doReveal();
    }
  });
  onResetReceived((data, peerId) => {
    console.log("Reset received from:", peerId);
    doReset();
  });
  onStateRequest((data, peerId) => {
    const state = {
      isRevealed,
      players: Array.from(players.entries()),
      localVote: localPlayer.voted ? localPlayer.vote : null
    };
    sendStateTo(peerId, state);
  });
  onStateSync((data, peerId) => {
    if (data.isRevealed && !isRevealed) {
      doReveal();
    }
  });
}
function updatePlayerPositions() {
  const remotePlayers = Array.from(players.values());
  const positions = getPlayerPositions(remotePlayers.length);
  remotePlayers.forEach((player, i) => {
    player.pos = positions[i];
    players.set(player.id, player);
  });
}
function userVote(val) {
  if (localPlayer.voted) return;
  localPlayer.voted = true;
  localPlayer.vote = val;
  spawnCard({ ...localPlayer, pos: { x: 0.5, y: 1.1 } }, val);
  broadcastVote(val, {
    id: localPlayer.id,
    name: localPlayer.name,
    color: localPlayer.color
  });
  elements.deck.classList.add("voted");
  checkState();
  renderHeader();
}
function checkState() {
  const allPlayers = getAllPlayers();
  const votedCount = allPlayers.filter((p) => p.voted).length;
  const totalPlayers = allPlayers.length;
  if (votedCount === totalPlayers && totalPlayers > 0 && votedCount > 0) {
    elements.revealBtn.classList.remove("hidden");
    elements.revealBtn.classList.add("scale-in");
    emit("allVotesIn", { count: votedCount });
  }
}
function revealCards() {
  doReveal();
  broadcastReveal();
}
function positionCardsForReveal() {
  const cardSize = getCardSize();
  const numCards = cards.length;
  const cardDiagonal = Math.sqrt(cardSize.w * cardSize.w + cardSize.h * cardSize.h);
  const minRadiusForSpacing = cardDiagonal * numCards / (2 * Math.PI) + cardDiagonal * 0.3;
  const baseRadius = Math.min(width, height) * REVEAL_RADIUS_RATIO;
  const radius = Math.max(baseRadius, minRadiusForSpacing);
  cards.forEach((card, i) => {
    setCardStatic(card, true);
    const angle = i / cards.length * Math.PI * 2 - Math.PI / 2;
    card.targetX = width / 2 + Math.cos(angle) * radius;
    card.targetY = height / 2 + Math.sin(angle) * radius;
    card.targetAngle = 0;
  });
}
function doReveal() {
  setIsRevealed(true);
  elements.revealBtn.classList.add("hidden");
  elements.deck.classList.add("revealed");
  positionCardsForReveal();
  spawnConfetti();
  emit("revealStarted", {});
}
function resetGame() {
  doReset();
  broadcastReset();
}
function doReset() {
  resetGameState();
  renderHeader();
}
function resetGameState() {
  setIsRevealed(false);
  setRevealComplete(false);
  clearEngine();
  setCards([]);
  setParticles([]);
  localPlayer.voted = false;
  localPlayer.vote = null;
  players.forEach((player, id) => {
    player.voted = false;
    player.vote = null;
    players.set(id, player);
  });
  if (elements.revealBtn) {
    elements.revealBtn.classList.add("hidden");
  }
  if (elements.deck) {
    elements.deck.classList.remove("voted", "revealed");
  }
}
function loop() {
  requestAnimationFrame(loop);
  if (!gameStarted) {
    ctx.clearRect(0, 0, width, height);
    return;
  }
  updateEngine();
  updateLogic();
  ctx.clearRect(0, 0, width, height);
  drawTable();
  drawParticles();
  drawCards();
  drawResetButton();
}
function updateLogic() {
  if (isRevealed) {
    let allSettled = cards.length > 0;
    cards.forEach((card) => {
      const smooth = config.revealSmooth;
      const cx = card.body.position.x;
      const cy = card.body.position.y;
      setCardPosition(
        card,
        cx + (card.targetX - cx) * smooth,
        cy + (card.targetY - cy) * smooth
      );
      const ca = card.body.angle;
      setCardAngle(card, ca + (card.targetAngle - ca) * smooth);
      if (card.flipProgress < 1) {
        card.flipProgress += config.flipSpeed;
      }
      const positionSettled = Math.abs(card.body.position.x - card.targetX) < 2 && Math.abs(card.body.position.y - card.targetY) < 2;
      const flipSettled = card.flipProgress >= 1;
      if (!positionSettled || !flipSettled) {
        allSettled = false;
      }
    });
    if (allSettled && !revealComplete) {
      setRevealComplete(true);
      emit("revealComplete", {});
    }
  } else if (cards.length > 0) {
    const velocityThreshold = 0.5;
    const allCardsSettled = cards.every((card) => {
      const v = card.body.velocity;
      const av = card.body.angularVelocity;
      return Math.abs(v.x) < velocityThreshold && Math.abs(v.y) < velocityThreshold && Math.abs(av) < velocityThreshold;
    });
    if (allCardsSettled && !cards._settledEmitted) {
      cards._settledEmitted = true;
      emit("cardsSettled", { count: cards.length });
    }
  }
  const updatedParticles = particles.filter((p) => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += PARTICLE_GRAVITY;
    p.life -= PARTICLE_DECAY;
    return p.life > 0;
  });
  if (updatedParticles.length !== particles.length) {
    setParticles(updatedParticles);
  }
}
if (true) {
  window.__SPKR_MOCK__ = {
    // Start game without P2P (for mock mode)
    startGame(name, color) {
      localPlayer.name = name;
      localPlayer.color = color;
      localPlayer.id = "local-mock";
      elements.colorInput.value = color;
      elements.colorPreview.style.backgroundColor = color;
      elements.nameInput.value = name;
      elements.roomCodeDisplay.textContent = "MOCK";
      hideLobby();
      hideLobbyStatus();
      setAdvertising();
      buildDeck();
      renderHeader();
    },
    // Local player votes
    vote(value) {
      userVote(value);
    },
    // Add a fake remote player and spawn their card
    addPlayer(id, name, color, vote) {
      const pos = getPlayerPositions(players.size + 1)[players.size];
      const player = { id, name, color, voted: true, vote, pos };
      players.set(id, player);
      spawnCard(player, vote);
      updatePeerCount(players.size);
      renderHeader();
      checkState();
    },
    // Trigger reveal
    reveal() {
      doReveal();
    },
    // Get current state
    getState() {
      return {
        players: players.size,
        cards: cards.length,
        isRevealed,
        revealComplete
      };
    }
  };
}
init();
