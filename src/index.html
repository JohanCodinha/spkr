<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joyful Scrum Poker</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <link rel="stylesheet" href="fonts.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Lobby Screen -->
    <div id="lobby-screen" class="lobby-screen">
        <div class="lobby-container glass-panel">
            <img src="logo.svg" alt="Scrum Poker logo" class="lobby-logo">
            <h1 class="lobby-title">Scrum Poker</h1>
            <p class="lobby-subtitle">Plan together, anywhere</p>

            <!-- Player Setup -->
            <div class="lobby-section">
                <div class="lobby-identity">
                    <div class="color-picker-wrapper lobby-color">
                        <input type="color" id="lobby-color-input" class="color-input" value="#3b82f6">
                        <div id="lobby-color-preview" class="color-preview"></div>
                    </div>
                    <input type="text" id="lobby-name-input" class="lobby-name-input" placeholder="Your name" maxlength="20">
                </div>
                <label class="lobby-observer">
                    <input type="checkbox" id="lobby-observer-input">
                    <span>Join as observer (view only)</span>
                </label>
            </div>

            <!-- Room Actions -->
            <div class="lobby-section">
                <button id="create-room-btn" class="lobby-btn lobby-btn-primary">
                    Create Room
                </button>

                <div class="lobby-divider">
                    <span>or join existing</span>
                </div>

                <div class="lobby-join">
                    <input type="text" id="room-code-input" class="lobby-code-input" placeholder="Enter room code" maxlength="6">
                    <button id="join-room-btn" class="lobby-btn lobby-btn-secondary">
                        Join
                    </button>
                </div>
            </div>

            <!-- Connection Status -->
            <div id="lobby-status" class="lobby-status hidden">
                <div class="lobby-spinner"></div>
                <span id="lobby-status-text">Connecting...</span>
            </div>

            <!-- Error Message -->
            <div id="lobby-error" class="lobby-error hidden"></div>
        </div>
    </div>

    <!-- Game Canvas -->
    <canvas id="game-canvas" class="game-canvas hidden" aria-label="Scrum poker game board"></canvas>

    <!-- UI Overlay -->
    <div id="ui-layer" class="ui-layer hidden">

        <!-- Header -->
        <div class="header">
            <!-- Room Info - Top Left -->
            <div class="glass-panel room-info">
                <div id="connection-beacon" class="connection-beacon" aria-label="Connection status">
                    <span class="beacon-dot"></span>
                </div>
                <span class="room-label">Room:</span>
                <span id="room-code-display" class="room-code">----</span>
                <button id="copy-room-btn" class="copy-btn" aria-label="Copy room code">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                </button>
                <button id="leave-room-btn" class="leave-btn" aria-label="Leave room">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
                </button>
            </div>

            <!-- Avatar UI - Top Center -->
            <div class="glass-panel avatar-wrapper">
                <div id="avatar-container" class="avatar-container" role="status" aria-live="polite" aria-label="Player voting status">
                    <!-- Avatars injected via JS -->
                </div>
            </div>

            <!-- Identity Controls - Top Right -->
            <div class="glass-panel identity-controls">
                <div class="color-picker-wrapper">
                    <label for="user-color-input-inline" class="sr-only">Choose your color</label>
                    <input type="color" id="user-color-input-inline" class="color-input" value="#3b82f6">
                    <div id="color-preview-inline" class="color-preview" aria-hidden="true"></div>
                </div>
                <label for="user-name-input-inline" class="sr-only">Enter your name</label>
                <input type="text" id="user-name-input-inline" class="name-input" value="You" placeholder="Your name">
            </div>
        </div>

        <!-- Settings Button - Bottom Right -->
        <button id="settings-btn" class="glass-panel settings-btn" aria-label="Open settings" aria-expanded="false" aria-controls="settings-panel">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.38a2 2 0 0 0-.73-2.73l-.15-.1a2 2 0 0 1-1-1.72v-.51a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>

        <!-- Settings Panel (Initially Hidden) -->
        <div id="settings-panel" class="hidden glass-panel settings-panel" role="dialog" aria-label="Physics configuration">

            <h3 class="settings-title">Physics Config</h3>

            <div class="settings-content">
                <div class="slider-group">
                    <div class="slider-header">
                        <label for="slider-restitution">Restitution (Bounce)</label>
                        <span id="val-restitution">0.6</span>
                    </div>
                    <input type="range" id="slider-restitution" min="0" max="1.2" step="0.1" value="0.6" data-config="restitution">
                </div>

                <div class="slider-group">
                    <div class="slider-header">
                        <label for="slider-frictionAir">Friction (Drag)</label>
                        <span id="val-frictionAir">0.035</span>
                    </div>
                    <input type="range" id="slider-frictionAir" min="0" max="0.07" step="0.001" value="0.035" data-config="frictionAir">
                </div>

                <div class="slider-group">
                    <div class="slider-header">
                        <label for="slider-throwForce">Throw Force</label>
                        <span id="val-throwForce">0.09</span>
                    </div>
                    <input type="range" id="slider-throwForce" min="0.01" max="0.17" step="0.005" value="0.09" data-config="throwForce">
                </div>

                <div class="slider-group">
                    <div class="slider-header">
                        <label for="slider-spin">Spin Force</label>
                        <span id="val-spin">0.3</span>
                    </div>
                    <input type="range" id="slider-spin" min="0" max="0.6" step="0.05" value="0.3" data-config="spin">
                </div>

                <hr>

                <div class="slider-group">
                    <div class="slider-header">
                        <label for="slider-revealSmooth">Reveal Speed (Lerp)</label>
                        <span id="val-revealSmooth">0.03</span>
                    </div>
                    <input type="range" id="slider-revealSmooth" min="0.005" max="0.06" step="0.001" value="0.03" data-config="revealSmooth">
                </div>

                <div class="slider-group">
                    <div class="slider-header">
                        <label for="slider-flipSpeed">Flip Speed</label>
                        <span id="val-flipSpeed">0.04</span>
                    </div>
                    <input type="range" id="slider-flipSpeed" min="0.01" max="0.07" step="0.005" value="0.04" data-config="flipSpeed">
                </div>

                <hr>

                <div class="slider-group">
                    <div class="slider-header">
                        <label for="slider-cardScale">Card Size</label>
                        <span id="val-cardScale">1.5</span>
                    </div>
                    <input type="range" id="slider-cardScale" min="0.5" max="2.0" step="0.1" value="1.5" data-config="cardScale">
                </div>

            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button id="reveal-btn" class="hidden reveal-btn" aria-label="Reveal all cards">
                Reveal Cards
            </button>

            <nav id="card-deck" class="glass-panel card-deck" role="toolbar" aria-label="Voting cards">
                <!-- Deck items injected via JS -->
            </nav>
        </div>
    </div>

    <!-- ENTRY_SCRIPT -->
</body>
</html>
