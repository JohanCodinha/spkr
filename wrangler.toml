name = "spkr"
main = "src/worker.js"
compatibility_date = "2024-12-01"
workers_dev = false
routes = [{ pattern = "eval.work", custom_domain = true }]

# Durable Objects for WebSocket signaling
[durable_objects]
bindings = [
  { name = "SIGNAL_ROOM", class_name = "SignalRoom" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SignalRoom"]

[assets]
directory = "public"

[env.beta]
routes = [{ pattern = "beta.eval.work", custom_domain = true }]

[env.beta.durable_objects]
bindings = [
  { name = "SIGNAL_ROOM", class_name = "SignalRoom" }
]
